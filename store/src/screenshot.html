<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    background: #0a0a0a;
    background-image: radial-gradient(circle at 50% 42%, #1c1c1c 0, #0a0a0a 60%);
    color: #fafafa;
    font-family: 'Geist', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .row { display: flex; align-items: center; gap: 72px; }
  .site { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .logo { width: 220px; height: 220px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .label { font-family: 'Geist Mono', monospace; font-size: 34px; color: #a3a3a3; }
  .label b { color: #fafafa; font-weight: 500; }
  .arrow { margin-bottom: 62px; }
  h1 { font-weight: 600; font-size: 52px; letter-spacing: -0.02em; margin: 88px 0 0; }
  p { font-size: 26px; color: #a3a3a3; margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="site">
      <svg class="logo" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#cb3837"/>
        <path fill="#fff" d="M48 48h160v160h-32V80h-48v128H48z"/>
      </svg>
      <div class="label"><b>npmjs</b>.com</div>
    </div>
    <svg class="arrow" width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 30h160M138 6l26 24-26 24" fill="none" stroke="#fafafa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="site">
      <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="64" fill="#0a0a0a" stroke="#262626" stroke-width="6"/>
        <rect x="110" y="310" width="60" height="60" fill="#525252"/>
        <text x="320" y="370" font-family="'Geist Mono', monospace" font-size="420" font-weight="500" text-anchor="middle" fill="#fafafa">/</text>
      </svg>
      <div class="label"><b>npmx</b>.dev</div>
    </div>
  </div>
  <h1>npm packages, opened on npmx.dev</h1>
  <p>Package and search links to npmjs.com redirect automatically.</p>
</body>
</html>
